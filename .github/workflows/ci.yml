name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. There is no Linux job: the CMakeLists branches on APPLE and WIN32.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DGRATICULE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The suites
        # Deterministic, and the only GPU they need is whatever the runner has:
        # the font, the colours and the RP 219 geometry need none at all, and
        # the pixel checks render a 640x360 frame a few dozen times. Each
        # test has a CTest TIMEOUT, so a hang fails with its name long before
        # this step's own limit.
        timeout-minutes: 15
        run: ctest --test-dir build --output-on-failure

      - name: Presets
        run: python3 tools/check_presets.py

      - name: Controls
        # The runner has no GPU. Under its software renderer a frame is cheap
        # and a new shader program is not: the first draw of each one is a
        # compile of the pattern shader, over 20 s here. The sweep used to
        # start a process per render, paid that ~140 times, and ran out of
        # this step's time on every push from the first (20 minutes, then 25).
        # It now renders in batches, one compile each: two batches plus one
        # reference render, on a three-core runner. 160x90 because the
        # question is only whether a control changed ANY subpixel. sweep.py
        # kills a batch that runs past its --timeout (300 s) and names the job
        # it was in, well inside this step's limit.
        timeout-minutes: 10
        run: python3 tools/sweep.py --size 160x90 --jobs 2

      - uses: actions/upload-artifact@v7
        with:
          name: graticule-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DGRATICULE_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: graticule-windows-x86_64
          path: build/Release/*.dll
          if-no-files-found: error
